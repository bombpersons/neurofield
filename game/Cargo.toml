[package]
name = "game"
version = "0.1.0"
edition = "2021"
description = "First-person walk through a generated level, drawn by the trained network, in Bevy"

[dependencies]
bevy = "0.20.0"
bevy_egui = "0.43.1"
datagen = { path = "../datagen" }
viewer = { path = "../viewer" }

# Bevy is slow unoptimised; optimise dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
