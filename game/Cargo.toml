[package]
name = "game"
version = "0.1.0"
edition = "2021"
description = "First-person walk through a generated level, drawn by the trained network, in Bevy"

[dependencies]
bevy.workspace = true
bevy_egui.workspace = true
psx-bevy.workspace = true
engine = { path = "../engine" }

[features]
# psx-bevy's developer MCP: run with --mcp [--headless --software].
dev-mcp = ["psx-bevy/dev-mcp"]
