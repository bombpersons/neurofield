[package]
name = "editor"
version = "0.1.0"
edition = "2021"
description = "Level editor for hand-built neurofield dungeons (see docs/editor.md)"

[dependencies]
bevy.workspace = true
bevy_egui.workspace = true
psx-bevy.workspace = true
egui_dock = { version = "0.21.1", features = ["serde"] }
engine = { path = "../engine" }
rfd = "0.17"
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
image = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[features]
# The editor's own developer MCP (src/mcp.rs): run with --mcp [--headless --software].
dev-mcp = ["dep:rmcp", "dep:tokio", "dep:image", "dep:base64"]
