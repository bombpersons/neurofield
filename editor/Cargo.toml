[package]
name = "editor"
version = "0.1.0"
edition = "2021"
description = "Level editor for hand-built neurofield dungeons (see docs/editor.md)"

[dependencies]
bevy.workspace = true
bevy_egui.workspace = true
psx-bevy.workspace = true
egui_dock = { version = "0.21.1", features = ["serde"] }
engine = { path = "../engine" }
egui-phosphor = "0.14"
rfd = "0.17"
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
# The editor's MCP server (src/mcp): stdio with --mcp, HTTP from Tools > Agents
# or --mcp-listen.
rmcp.workspace = true
tokio.workspace = true
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
image.workspace = true
base64.workspace = true

[features]
# The MCP's testing tools (mouse and keyboard input, widgets), on stdio only:
# run with --mcp [--headless --software].
dev-mcp = []
