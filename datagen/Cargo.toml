[package]
name = "datagen"
version = "0.1.0"
edition = "2021"
description = "Procedural PS1-style scenes rendered with psx-gte + psx-gpu, as training data for a neural renderer"

[dependencies]
# Software PS1 GPU and GTE from the psx submodule (https://github.com/bombpersons/psx).
psx-gpu = { path = "../external/psx/crates/psx-gpu" }
psx-gte = { path = "../external/psx/crates/psx-gte" }
png = "0.17"
rayon = "1"

[profile.release]
opt-level = 3
